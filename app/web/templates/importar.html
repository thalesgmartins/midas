{% extends "base.html" %}
{% block title %}Importar CSV — Midas{% endblock %}
{% block content %}
<div class="bg-surface border border-white/[0.08] rounded-2xl p-6 max-w-xl">
  <h1 class="font-semibold text-xl text-offwhite mb-1">Importar Carteira</h1>
  <p class="text-xs text-muted mb-5">
    CSV separado por <code class="num text-offwhite">;</code> com as colunas: Tipo de ativo; Ativo; Quant.; Preço Médio; Preço Atual; Saldo; % Ideal.
  </p>
  {% if msg %}
    <div class="mb-4 px-3.5 py-2.5 rounded-xl bg-sage/15 border border-sage/30 text-sage text-xs font-medium flex items-center justify-between">
      <span>{{ msg }}</span>
      <a href="/estatisticas" class="underline text-offwhite">Ver carteira</a>
    </div>
  {% endif %}
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    <label class="block border border-dashed border-white/[0.18] hover:border-marine rounded-xl p-6 bg-deep text-center cursor-pointer transition-colors">
      <span class="block text-sm text-offwhite font-medium mb-1">Selecione o arquivo CSV</span>
      <span class="block text-xs text-muted mb-3">Reimportar atualiza quantidades e preços, preservando status, preço teto e segmentos.</span>
      <input type="file" name="arquivo" accept=".csv,.txt" class="text-xs text-muted file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-marine/20 file:text-offwhite hover:file:bg-marine/30">
    </label>
    <button class="w-full bg-marine hover:bg-marine/90 text-offwhite rounded-xl px-5 py-2.5 text-sm font-medium transition-colors">
      Importar carteira
    </button>
  </form>
</div>
{% endblock %}
